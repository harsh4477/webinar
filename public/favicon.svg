<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg-grad)" />
  
  <!-- Video Screen Frame -->
  <rect x="96" y="112" width="320" height="220" rx="24" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="8" />

  <!-- Play Triangle Symbol -->
  <path d="M224 176 L320 222 L224 268 Z" fill="url(#icon-grad)" filter="url(#shadow)" />

  <!-- Live/Webinar Broadcast Signal Waves -->
  <circle cx="376" cy="144" r="12" fill="#ef4444" />
  <circle cx="376" cy="144" r="24" fill="none" stroke="#ef4444" stroke-width="4" opacity="0.6" />

  <!-- Presenter Podium / Webinar Text Line Base -->
  <path d="M120 380 H392 M180 420 H332" stroke="url(#icon-grad)" stroke-width="14" stroke-linecap="round" opacity="0.9" />
</svg>